name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Check whitespace
        run: |
          git show --check --pretty=format: --no-ext-diff HEAD

      - name: Build
        run: |
          xcodebuild \
            -project TimerTomato.xcodeproj \
            -scheme TimerTomato \
            -configuration Debug \
            -destination platform=macOS \
            -derivedDataPath "$RUNNER_TEMP/TimerTomatoDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test
        run: |
          xcodebuild \
            -project TimerTomato.xcodeproj \
            -scheme TimerTomato \
            -configuration Debug \
            -destination platform=macOS \
            -derivedDataPath "$RUNNER_TEMP/TimerTomatoDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test -only-testing:TimerTomatoTests
